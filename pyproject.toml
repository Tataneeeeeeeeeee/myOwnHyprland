[project]
name = "myhypr"
version = "0.1.0"
description = "Agent IA local (Ollama) qui génère et valide des configs Hyprland / Waybar"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.5",
    "numpy>=2.0",
    "rich>=15.0.0",
    "prompt-toolkit>=3.0.53",
]

[project.scripts]
myhypr = "myhypr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
